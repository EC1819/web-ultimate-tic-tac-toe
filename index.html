<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Ultimate Tic Tac Toe</h1>
        <p class="subtitle">by Emmanuel (Manny) Canizales </p>
        <div class="controls">
            <div class="mode-toggle" role="group" aria-label="Game mode">
                <button type="button" class="mode-btn active" data-mode="ai" aria-pressed="true">Play vs AI</button>
                <button type="button" class="mode-btn" data-mode="friend" aria-pressed="false">Play vs Friend</button>
            </div>
            <button type="button" id="new-game" class="new-game-btn">New Game</button>
        </div>
        <p id="status">Your turn</p>
        <div id="ultimate-board">
        <div class="sub-board" data-board="0">
            <div class="cell" data-cell="0"></div>
            <div class="cell" data-cell="1"></div>
            <div class="cell" data-cell="2"></div>
            <div class="cell" data-cell="3"></div>
            <div class="cell" data-cell="4"></div>
            <div class="cell" data-cell="5"></div>
            <div class="cell" data-cell="6"></div>
            <div class="cell" data-cell="7"></div>
            <div class="cell" data-cell="8"></div>
        </div>
        <div class="sub-board" data-board="1">
            <div class="cell" data-cell="0"></div>
            <div class="cell" data-cell="1"></div>
            <div class="cell" data-cell="2"></div>

            <div class="cell" data-cell="5"></div>
            <div class="cell" data-cell="6"></div>
            <div class="cell" data-cell="7"></div>
            <div class="cell" data-cell="8"></div>
        </div>
        <div class="sub-board" data-board="2">
            <div class="cell" data-cell="0"></div>
            <div class="cell" data-cell="1"></div>
            <div class="cell" data-cell="2"></div>
            <div class="cell" data-cell="3"></div>
            <div class="cell" data-cell="4"></div>
            <div class="cell" data-cell="5"></div>
            <div class="cell" data-cell="6"></div>
            <div class="cell" data-cell="7"></div>
            <div class="cell" data-cell="8"></div>
        </div>
        <div class="sub-board" data-board="3">

            <div class="cell" data-cell="2"></div>

            <div class="cell" data-cell="4"></div>
            <div class="cell" data-cell="5"></div>
